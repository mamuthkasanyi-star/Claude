# Mamuthka linux: az Xorg a vt7-en örökre a VT_WAITACTIVE-ban állt, mert a
# Plymouth a tty1-et grafikus (KD_GRAPHICS) módban hagyta, és a kernel
# KD_GRAPHICS + VT_AUTO módú konzolról nem vált VT-t (change_console()).
# Indulás előtt leállítjuk a Plymouth-ot, és a konzolt szöveges módba tesszük.
# (hibak.txt 56.)
[Service]
ExecStartPre=-/usr/libexec/mamuthka/vt-reset

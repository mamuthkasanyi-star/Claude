# Mamuthka linux: a kijelzőre (tty0 konzol) csak a kritikus kernelüzenetek
# kerüljenek. A bootloader a cmdline végére loglevel=4-et fűz, ami a miénket
# felülírja; e nélkül a driverek KERN_ERR üzenetei (abox, mfc, fimc…) a
# Plymouth és az asztal fölé íródnak. A teljes napló: dmesg / journalctl -k.
kernel.printk = 3 4 1 3

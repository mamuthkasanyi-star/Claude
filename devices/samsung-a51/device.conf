# Samsung Galaxy A51 (SM-A515F, a51, Exynos 9611)
# shellcheck shell=bash
#
# Források: az archivált postmarketOS samsung-a51 port (pmaports
# device/archived/{device,linux}-samsung-a51), a LineageOS universal9611
# BoardConfig, és a dima-xd/ubuntu-touch-sm-a515f valódi készüléken mért
# adatai (halium/device/samsung-a51/device-facts.md).

DEVICE_NAME="Samsung Galaxy A51 (SM-A515F)"
DEVICE_ARCH="arm64"

# --- Kernel -----------------------------------------------------------------
# Ugyanaz a kernel, amit a postmarketOS port használ (bizonyítottan elindul).
KERNEL_REPO="https://github.com/manoedinata/android_kernel_samsung_a51"
KERNEL_COMMIT="c8dd4c096e0ba7b7cbdb6eb2ea6c7affd006198b"
KERNEL_DTB="exynos9610.dtb"

# --- boot.img (header v2) ---------------------------------------------------
# Az S-Boot figyelmen kívül hagyja a header cmdline-t, ezért a valódi
# paraméterek a CONFIG_CMDLINE-ban vannak (kernel/mamuthka.config). A kernel
# ezek MÖGÉ fűzi a bootloader paramétereit; az ott lévő console=ram lesz a
# preferált konzol, de a console=tty0 is regisztrálódik (a kijelzőn látszik).
BOOTIMG_HEADER_VERSION="2"
BOOTIMG_PAGESIZE="2048"
BOOTIMG_BASE="0x10000000"
BOOTIMG_KERNEL_OFFSET="0x00008000"
BOOTIMG_RAMDISK_OFFSET="0x01000000"
BOOTIMG_SECOND_OFFSET="0xf0000000"
BOOTIMG_TAGS_OFFSET="0x00000100"
BOOTIMG_DTB_OFFSET="0x00000000"
BOOTIMG_OS_VERSION="13.0.0"
BOOTIMG_OS_PATCH_LEVEL="2023-08"
BOOTIMG_BOARD="SRPSG30B008KU"
# (Az androidboot.selinux=… az Android init-é, a kernel nem értelmezi, ezért
# nincs itt. A kernelben a SELinux be van fordítva, de policy nélkül Ubuntu
# alatt nem kényszerít semmit.)
BOOTIMG_CMDLINE="loop.max_part=7"
BOOTIMG_APPEND_SEANDROIDENFORCE="1"
# A boot partíció mérete; a nagyobb képet a dd/heimdall csendben levágná.
BOOT_PARTITION_SIZE="61865984"
RECOVERY_PARTITION_SIZE="71106560"

# --- Partíciók / flashelés ---------------------------------------------------
# A heimdall a PIT-ben lévő nagybetűs neveket várja (kipróbálva: --RECOVERY).
# A flash-a51.sh alapértékeit a kiadás készítése ezekből tölti ki.
HEIMDALL_PARTITION_BOOT="BOOT"
HEIMDALL_PARTITION_RECOVERY="RECOVERY"
HEIMDALL_PARTITION_ROOTFS="USERDATA"
# A rendszer a userdata partícióra kerül (~111 GiB); első induláskor
# automatikusan kitölti a teljes partíciót.
ROOTFS_LABEL="mamuthka_root"

# --- Firmware (Wi-Fi: Samsung SCSC mx140) -------------------------------------
FIRMWARE_DIR="/lib/firmware/samsung-a51"
FIRMWARE_BASE_URL="https://dumps.tadiphone.dev/dumps/samsung/a51/-/raw/4c72faa15ca0875510fde40a4b0686d4c161d0b4/vendor/etc/wifi"
# fájlnév  sha512
FIRMWARE_FILES="
mx140.bin 2a94883cab2b623eee67a0cf6f38d6a35264d01b03b69efc2292bf18dfa6d1280370e486c2021fb6ba3ddfd5e79dce8fd0febe754e8b1d39d30b412ec4fd4a3f
mx140_wlan.hcf 31d2097a5b3acf88f63cb3d99cb10ac6329ee7d2ef32ca8312777dbcf452d709eb82f22737024a5cd7f3849a3498b73e377d1f0683d0b49e4d01da9c9b59bb0b
mx140_wlan_sw.hcf 58a2ea8e2834f4115c704503b18851c18389f11f8b1f657804689b8c09b20b7b8c1f4c4cc677eaa21a4013cdd667715a358df4b4d0bb7ce2b13010845e4deb05
"

# --- USB (debug hálózat) ------------------------------------------------------
USB_ID_VENDOR="0x04e8"
USB_ID_PRODUCT="0x685d"
USB_NET_IP="172.16.42.1"
USB_NET_CLIENT_IP="172.16.42.2"

# --- Kijelző -------------------------------------------------------------------
SCREEN_WIDTH="1080"
SCREEN_HEIGHT="2400"

# Csomagok, amelyek csak ehhez az eszközhöz kellenek
DEVICE_PACKAGES="xserver-xorg-video-fbdev"

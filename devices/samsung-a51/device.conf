# --- Egyéb gyári firmware (hang, videó, Wi-Fi kiegészítők) ---------------------
# Ugyanabból a gyári vendor-dumpból (A515FXXU7HWF1), mint a Wi-Fi firmware; a
# repóba blob nem kerül, a build tölti le és sha512-vel ellenőrzi.
#  - calliope_*.bin: az ABOX hang-DSP (nélküle „Invalid calliope state”, IPC-
#    túlcsordulás és ~5 ms-onként uevent → systemd-udevd 100% CPU);
#  - spkamp/AP*_AUDIO_SLSI/param_ti: a DT abox gyerekeinek extra firmware-e;
#  - mfc_fw.bin: hardveres videódekóder (mfc_open … -2);
#  - slsi_reg_database.bin: a Wi-Fi országkód-adatbázisa;
#  - log-strings.bin: a WLBT naplószövegei (MXlog), csak diagnosztika.
# Nincs a dumpban (a gyári rendszerben sincs, ártalmatlan): mx140_common.hcf,
# mx140_localmib.hcf, a mip4_ts érintő-firmware (a chipen naprakész).
# Az ABOX a calliope firmware-t a kernel indulásakor (~2,1 s, még a /init
# előtt) kéri, újrapróbálás nélkül → ezeknek az initramfs-ben is ott kell
# lenniük (build-bootimg.sh; a forrás és a sha512 a lenti listából jön).
INITRAMFS_FIRMWARE="calliope_sram.bin calliope_dram.bin calliope_iva.bin"
VENDOR_FIRMWARE_BASE_URL="https://dumps.tadiphone.dev/dumps/samsung/a51/-/raw/4c72faa15ca0875510fde40a4b0686d4c161d0b4/vendor"
# forrás (a vendor alatt)  cél (a rootfs-ben)  sha512

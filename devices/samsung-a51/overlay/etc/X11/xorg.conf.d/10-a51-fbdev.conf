# Galaxy A51: Exynos DECON framebuffer (nincs DRM), 1080x2400 álló.
Section "Device"
	Identifier "decon"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
	Option "ShadowFB" "on"
	# Futás közbeni forgatás (xrandr --output DSI-1 --rotate …): a Mamuthka
	# fbdev-patch adja (usr/share/mamuthka/setup.d/50-fbdev-forgatas.sh).
	# Élőben kipróbálva 2026-10-17 (hibak.txt 82.). Kikapcsolás: "off" = a
	# gyári fbdev-viselkedés (és /etc/mamuthka/forgatas.conf: enabled=0).
	Option "RandRRotation" "on"
EndSection

Section "Screen"
	Identifier "screen"
	Device "decon"
	DefaultDepth 24
EndSection

Section "ServerFlags"
	Option "BlankTime" "0"
EndSection

# Érintőképernyő (Melfas MSS100) – libinput, egérként is működik
Section "InputClass"
	Identifier "a51-touchscreen"
	MatchIsTouchscreen "on"
	Driver "libinput"
EndSection

# A markolás-érzékelő (grip_sensor, grip_sensor_sub, grip_notifier) a kernelben
# billentyűzetnek látszik; a libinput a grip_sensort elutasítja ((EE) a
# naplóban), a _sub-ot pedig virtuális egérként veszi fel. X alatt egyik sem
# kell (hibak.txt 76.).
Section "InputClass"
	Identifier "a51-grip-ignore"
	MatchProduct "grip_"
	Option "Ignore" "on"
EndSection

# Galaxy A51: Exynos DECON framebuffer (nincs DRM), 1080x2400 álló.
Section "Device"
	Identifier "decon"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
	Option "ShadowFB" "on"
EndSection

Section "Screen"
	Identifier "screen"
	Device "decon"
	DefaultDepth 24
EndSection

Section "ServerFlags"
	Option "BlankTime" "0"
EndSection

# Érintőképernyő (Melfas MSS100) – libinput, egérként is működik
Section "InputClass"
	Identifier "a51-touchscreen"
	MatchIsTouchscreen "on"
	Driver "libinput"
EndSection

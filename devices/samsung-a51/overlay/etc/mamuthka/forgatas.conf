# Mamuthka automatikus forgatás (/usr/bin/mamuthka-forgatas).
# Felhasználónként felülírható: ~/.config/mamuthka-forgatas.conf
# Kikapcsolás: enabled=0 (vagy: touch ~/.config/mamuthka-forgatas.off)
# Az xorg.conf.d/10-a51-fbdev.conf „RandRRotation” opciója is "on" kell
# legyen (élőben kipróbálva 2026-10-17, hibak.txt 82.).
enabled=1
# A gyorsulásmérő tengelyei az Android-konvenció szerint (álló helyzetben
# y≈+1 g). Ha a kép rossz irányba fordul, itt lehet tükrözni/cserélni.
swap_xy=0
invert_x=0
invert_y=0
# Fordított (fejjel lefelé) helyzet engedélyezése
allow_inverted=0
# Az érintőképernyő X-neve (xinput list)
touch=sec_touchscreen
# Mintavétel (s) bekapcsolt kijelzőnél, és ennyi ideig stabil állás kell
interval=0.4
settle=0.8

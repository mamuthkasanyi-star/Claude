# PC (x86_64) – Mamuthka linux live-rendszer pendrive-ra / ISO-ra
# shellcheck shell=bash
#
# Telepítés nélkül, pendrive-ról indul (casper live, mint az Ubuntu telepítő),
# UEFI-vel (Secure Boot is: Ubuntu által aláírt shim + GRUB) és legacy
# BIOS-szal. Kernel: Ubuntu generic. Az A51-es részek (saját kernel, fbdev,
# sensorhub, forgatás, USB-háló, /efs) itt nincsenek.
# Építés: sudo -E DEVICE=pc-amd64 ./scripts/build-pc-live.sh

DEVICE_NAME="PC (x86_64, live)"
DEVICE_ARCH="amd64"

# A build-rootfs.sh a FIRMWARE_DIR alá egy üres „mx140/mx” fájlt tesz (A51);
# a /tmp-t a setup.sh a végén kiüríti, így a live-rendszerbe nem kerül semmi.
FIRMWARE_DIR="/tmp/mamuthka-nincs-firmware"
FIRMWARE_BASE_URL=""
FIRMWARE_FILES=""
VENDOR_FIRMWARE_BASE_URL=""
VENDOR_FIRMWARE_FILES=""

# Nincs USB-hálózat (az A51 debug-hálózata); a device.env miatt üresen kell.
USB_NET_IP=""
USB_NET_CLIENT_IP=""

# A live-rendszer nem ext4 partícióról indul; a címke csak a device.env-be kerül.
ROOTFS_LABEL="mamuthka_pc"

# Háttérkép és boot-logó mérete (a fekvő háttérkép ebből készül).
SCREEN_WIDTH="1920"
SCREEN_HEIGHT="1080"

# Live ISO
LIVE_ISO_NAME="mamuthka-linux-pc-amd64.iso"
LIVE_VOLUME_ID="MAMUTHKA_PC"
# A casper ebben a mappában keresi a filesystem.squashfs-t (live-media-path):
# így a pendrive-on nem ütközik egy Ubuntu/Mint telepítő /casper mappájával.
LIVE_MEDIA_PATH="mamuthka"

# Csomagok, amelyek csak a PC-hez kellenek: Ubuntu generic kernel (a
# linux-firmware-rel és a mikrokódokkal együtt), casper live-rendszer, minden
# Xorg-videódriver (modesetting az xserver-xorg-core-ban; amdgpu, intel/i915,
# nouveau, radeon, vmware, qxl), Vulkan/VA-API, hang (PipeWire, SOF), Bluetooth,
# fájlrendszer-eszközök.
DEVICE_PACKAGES="linux-image-generic linux-firmware intel-microcode amd64-microcode
 casper user-setup uuid-runtime
 xserver-xorg-video-all xserver-xorg-input-all mesa-vulkan-drivers mesa-va-drivers va-driver-all
 pipewire-pulse wireplumber pipewire-alsa alsa-utils alsa-ucm-conf firmware-sof-signed
 bluez blueman
 dosfstools mtools ntfs-3g exfatprogs gparted
 pciutils usbutils lshw efibootmgr nvme-cli smartmontools
 xinput"

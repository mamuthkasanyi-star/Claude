name: Mamuthka linux – libhybris (A51, kísérleti)

# Kísérleti GPU-build: a Droidian libhybris (droidian ág) natív arm64-en,
# Android 13 fejlécekkel (halium/android-headers, halium-13.0 ág), Ubuntu 24.04
# ABI-val (a telefon rootfs-e is noble). Csak a külön claude/libhybris-a51
# ágon, illetve kézzel fut, így a fő build-a51.yml-t nem zavarja.
on:
  workflow_dispatch:
  push:
    branches: [claude/libhybris-a51]
    paths: ['.github/workflows/libhybris-a51.yml', 'devices/samsung-a51/gpu/**']

permissions:
  contents: read

jobs:
  libhybris:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Függőségek
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config git quilt \
            libwayland-dev libwayland-egl-backend-dev wayland-protocols libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-dri3-dev libxcb-present-dev libxext-dev libglvnd-dev patchelf python3
      - name: GPU-build (gpu-build.sh – ugyanaz, ami a rootfs-be kerül)
        run: |
          sudo apt-get install -y curl unzip e2fsprogs
          ./devices/samsung-a51/gpu/gpu-build.sh "$GITHUB_WORKSPACE/out"
      - name: Csomag
        run: |
          tar -C out -czf libhybris-a51-rel.tar.gz --exclude=usr/lib/mamuthka/gpu/android usr/lib/mamuthka/gpu
          ls -la libhybris-a51-rel.tar.gz
          find out -maxdepth 6 | head -50
          du -sh out/usr/lib/mamuthka/gpu/*
      - uses: actions/upload-artifact@v4
        with:
          name: libhybris-a51-rel
          path: libhybris-a51-rel.tar.gz
